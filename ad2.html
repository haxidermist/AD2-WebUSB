<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AD2 WebUSB</title>
<style>
  :root { --bg: #f6f6f4; --fg: #1d1d1b; --mut: #6b6b66; --line: #d9d9d4; --card: #ffffff; --acc: #1f6feb; --ok: #1a7f37; --bad: #c62828;
          --grid: #e6e6e1; --axis: #c9c9c3; --c1: #d97706; --c2: #2563eb; --trig: #9333ea; }
  @media (prefers-color-scheme: dark) { :root { --bg: #161615; --fg: #e8e8e4; --mut: #9a9a94; --line: #34342f; --card: #1f1f1d; --acc: #58a6ff;
          --ok: #3fb950; --bad: #f47067; --grid: #2a2a27; --axis: #44443f; --c1: #f5a524; --c2: #6ea8ff; --trig: #c084fc; } }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }            /* .row / .bits set display, which would override the attribute */
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.45 system-ui, sans-serif; }
  main { max-width: 980px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  h2 { font-size: 15px; margin: 0 0 10px; }
  p.sub { margin: 0 0 18px; color: var(--mut); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin-bottom: 14px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; }
  button, select, input[type=number] { font: inherit; padding: 6px 12px; border-radius: 7px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); }
  input[type=number] { width: 7em; padding: 6px 8px; }
  button { cursor: pointer; } button.primary { background: var(--acc); border-color: var(--acc); color: #fff; }
  button:disabled, select:disabled, input:disabled { opacity: .45; cursor: default; }
  label { color: var(--mut); font-size: 14px; display: inline-flex; gap: 6px; align-items: center; }
  .stat { display: grid; grid-template-columns: max-content 1fr; gap: 2px 14px; font: 13px/1.5 ui-monospace, monospace; }
  .stat dt { color: var(--mut); font-family: system-ui, sans-serif; }
  .stat dd { margin: 0; }
  .ok { color: var(--ok); } .bad { color: var(--bad); }
  .muted { color: var(--mut); }
  canvas { width: 100%; height: 380px; display: block; border-radius: 6px; background: var(--card); }
  .chips { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 10px; }
  .chip { display: flex; gap: 8px; align-items: baseline; }
  .sw { width: 12px; height: 3px; border-radius: 2px; display: inline-block; transform: translateY(-3px); }
  progress { width: 100%; height: 8px; margin-top: 10px; }
  pre { margin: 0; max-height: 200px; overflow: auto; font: 12.5px/1.4 ui-monospace, monospace; white-space: pre-wrap; color: var(--mut); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 720px) { .grid2 { grid-template-columns: 1fr; } canvas { height: 280px; } }
  /* left control panel: tiles + one slider */
  #panel { position: fixed; left: 0; top: 0; bottom: 0; width: 360px; background: var(--card); border-right: 1px solid var(--line);
           padding: 0 12px 16px; overflow-y: auto; transform: translateX(-100%); transition: transform .18s ease; z-index: 20; }
  body.panel-open #panel { transform: none; }
  body.panel-open { padding-left: 360px; }
  @media (max-width: 860px) { body.panel-open { padding-left: 0; } #panel { box-shadow: 0 0 24px rgba(0,0,0,.25); } }
  #popen { position: fixed; top: 12px; left: 12px; z-index: 19; }
  body.panel-open #popen { display: none; }
  .phead { display: flex; justify-content: space-between; align-items: center; padding: 14px 0 10px; }
  .sbox { position: sticky; top: 0; z-index: 1; background: var(--card); padding: 4px 0 10px; border-bottom: 1px solid var(--line); margin-bottom: 8px; }
  .sbox .row { flex-wrap: nowrap; }
  #sname { font-size: 13px; color: var(--mut); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #sval { font: 600 15px/1.2 ui-monospace, monospace; }
  #sedit { width: 7.5em; padding: 3px 6px; font: 600 13.5px ui-monospace, monospace; text-align: right; border-radius: 6px;
           border: 1px solid var(--line); background: var(--bg); color: var(--fg); }
  #sedit:disabled { opacity: .4; }
  #sunit { font-size: 12px; min-width: 2.2em; }
  #slider { flex: 1; min-width: 0; accent-color: var(--acc); }
  .sbox button { padding: 2px 10px; }
  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .tgrp { grid-column: 1 / -1; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--mut); margin: 8px 2px 0; }
  .tile { text-align: left; padding: 7px 9px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); min-height: 54px;
          display: flex; flex-direction: column; justify-content: space-between; gap: 3px; }
  .tile .tl { font-size: 11.5px; color: var(--mut); }
  .tile .tv { font: 600 13.5px/1.25 ui-monospace, monospace; word-break: break-word; }
  .tile.var .tl::after { content: " ⇄"; opacity: .6; }
  .tile.sel { outline: 2px solid var(--acc); outline-offset: -2px; }
  .tile.on { border-color: var(--acc); background: color-mix(in srgb, var(--acc) 14%, var(--bg)); }
  .tile.info { cursor: pointer; }
  /* panel on the right (default): mirror the left-hand layout */
  body.side-right #panel { left: auto; right: 0; border-right: 0; border-left: 1px solid var(--line); transform: translateX(100%); }
  body.side-right.panel-open #panel { transform: none; }
  body.side-right.panel-open { padding-left: 0; padding-right: 360px; }
  body.side-right #popen { left: auto; right: 12px; }
  body.side-right:not(.panel-open) .topbar { padding-left: 16px; padding-right: 130px; }
  @media (max-width: 860px) { body.side-right.panel-open { padding-right: 0; } }
  /* top status bar */
  .topbar { position: sticky; top: 0; z-index: 15; display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center;
            padding: 8px 16px; background: var(--card); border-bottom: 1px solid var(--line); font-size: 14px; }
  .topbar .brand { font-size: 16px; margin-right: 4px; }
  .topbar .sep { width: 1px; align-self: stretch; background: var(--line); margin: 0 2px; }
  .topbar .kv { display: inline-flex; gap: 5px; align-items: baseline; font: 12.5px ui-monospace, monospace; }
  .topbar .k { color: var(--mut); font: 12px system-ui, sans-serif; }
  .topbar button { padding: 4px 10px; }
  .topbar input[type=file] { font-size: 12.5px; max-width: 210px; }
  .topbar progress { width: 120px; margin: 0; }
  body:not(.panel-open) .topbar { padding-left: 130px; }
  main { max-width: 1280px; }
  /* bit editor for 16-bit masks (replaces the slider when a mask tile is selected) */
  .bits { display: grid; grid-template-columns: repeat(8, 1fr); gap: 3px; }
  .bits button { padding: 3px 0; font: 11px ui-monospace, monospace; border-radius: 5px; }
  .bits button.b1 { background: var(--acc); border-color: var(--acc); color: #fff; }
  .tile.bits16 .tl::after { content: " ⊞"; opacity: .6; }
  .tile.act .tl::after { content: " ▶"; opacity: .5; }
  /* help mode tooltips */
  #tip { position: fixed; z-index: 50; max-width: 300px; padding: 8px 11px; border-radius: 8px; font-size: 13px; line-height: 1.45;
         background: var(--fg); color: var(--bg); box-shadow: 0 4px 18px rgba(0,0,0,.25); pointer-events: none; }
  .helpbtn[aria-pressed="true"] { background: var(--acc); border-color: var(--acc); color: #fff; }
  body.help [data-help] { cursor: help; }
  /* ===== DSPECT look and feel (dark field-instrument theme) ===== */
  :root, :root:not([data-theme="light"]) {
    --bg: #151515; --card: #1d211f; --plot: #1a1a1a; --fg: #d9dfcf; --mut: #8b958d; --line: #2c322e; --frame: #4b554f;
    --tile: #3a4640; --tile-hi: #46544c; --acc: #ffb400; --ok: #33e05a; --bad: #ff4d5a; --teal: #0d6a73; --teal-ink: #9fe3e6;
    --grid: #2b302d; --axis: #4b554f; --c1: #ffd23f; --c2: #4fd1ff; --trig: #ff8a3d;
    --cond: "Roboto Condensed", "Arial Narrow", "Liberation Sans Narrow", "DejaVu Sans Condensed", sans-serif-condensed, sans-serif;
    --mono: ui-monospace, "DejaVu Sans Mono", Menlo, Consolas, monospace;
    color-scheme: dark;
  }
  body { background: var(--bg); color: var(--fg); font-family: var(--cond); -webkit-tap-highlight-color: transparent; }
  .muted, .k { color: var(--mut); }
  /* status bar */
  .topbar { margin: 8px; border-radius: 12px; background: var(--card); border: 1px solid var(--line); top: 8px; font-family: var(--cond); }
  .topbar .brand { color: var(--ok); font-size: 20px; font-weight: 700; letter-spacing: .5px; text-shadow: 0 0 8px rgba(51,224,90,.35); white-space: nowrap; }
  .topbar .brand span { color: var(--mut); font-weight: 400; font-size: 16px; text-shadow: none; }
  .topbar .brand .ver { color: var(--ok); opacity: .7; font-size: 14px; font-weight: 700; }
  .topbar .kv { font-family: var(--mono); }
  .topbar .sep { background: var(--line); }
  .leds { display: inline-flex; gap: 6px; align-items: center; }
  .led { width: 11px; height: 11px; border-radius: 50%; background: #333a36; display: inline-block; }
  .led.on.g { background: var(--ok); box-shadow: 0 0 6px var(--ok); }
  .led.on.y { background: var(--acc); box-shadow: 0 0 6px var(--acc); }
  .led.on.r { background: #ff6a3d; box-shadow: 0 0 6px #ff6a3d; }
  button, select, input[type=number], input[type=text], #sedit { font-family: var(--cond); }
  .topbar button, .phead button { background: var(--tile); color: var(--fg); border: 0; border-radius: 6px; font-weight: 700; letter-spacing: .5px; padding: 5px 12px; }
  .topbar button.primary { background: var(--teal); color: var(--teal-ink); }
  .topbar button:active, .phead button:active { background: var(--ok); color: #102010; }
  .topbar button:disabled { background: #262b28; color: var(--mut); }
  .helpbtn[aria-pressed="true"] { background: var(--acc) !important; color: #1a1a1a !important; }
  .topbar input[type=file] { color: var(--mut); }
  /* displays */
  .card { background: var(--plot); border: 2px solid var(--frame); border-radius: 6px; }
  canvas { background: var(--plot); }
  .chips, .chip, #sinfo, #linfo { font-family: var(--mono); font-size: 13px; }
  .chip b { font-family: var(--cond); font-size: 15px; }
  pre#log { color: var(--mut); font-family: var(--mono); }
  /* control panel */
  #panel { background: var(--bg); border-color: var(--line); }
  .phead b { color: var(--ok); font-size: 18px; letter-spacing: .5px; }
  .sbox { background: var(--bg); border-bottom-color: var(--line); }
  #sname { font: 15px var(--mono); color: var(--mut); letter-spacing: 1px; }
  #sedit { background: #0c0c0c; color: var(--acc); border: 1px solid var(--frame); font: 700 16px var(--mono); }
  #sunit { color: var(--mut); font-family: var(--mono); }
  .sbox button { background: var(--tile); color: var(--fg); border: 0; border-radius: 6px; font: 700 18px var(--cond); padding: 6px 12px; }
  input[type=range]#slider { -webkit-appearance: none; appearance: none; height: 54px; background: transparent; margin: 0; }
  #slider::-webkit-slider-runnable-track { height: 14px; border-radius: 7px; background: #0c0c0c; }
  #slider::-moz-range-track { height: 14px; border-radius: 7px; background: #0c0c0c; }
  #slider::-webkit-slider-thumb { -webkit-appearance: none; width: 50px; height: 50px; margin-top: -18px; border-radius: 50%;
    background: radial-gradient(circle, #5a5130 0 4px, #b09a50 5px 100%); border: 2px solid #6c5f32; box-shadow: 0 2px 6px #0009; }
  #slider::-moz-range-thumb { width: 46px; height: 46px; border-radius: 50%; background: #b09a50; border: 2px solid #6c5f32; }
  #slider:disabled { opacity: .35; }
  .bits button { background: var(--tile); color: var(--fg); border: 0; font-family: var(--mono); }
  .bits button.b1 { background: var(--acc); color: #1a1a1a; }
  .tiles { grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .tgrp { color: var(--mut); font: 700 12px var(--cond); letter-spacing: 1.5px; }
  .tile { background: var(--tile); border: 0; border-radius: 6px; color: var(--fg); font-family: var(--cond); min-height: 62px;
          padding: 4px 3px; align-items: center; justify-content: center; text-align: center; gap: 2px;
          transition: background .1s, transform .06s; }
  .tile:hover { background: var(--tile-hi); }
  .tile:active { transform: scale(.96); }
  .tile .tl { font: 700 14px/1.05 var(--cond); color: var(--fg); letter-spacing: .5px; }
  .tile .tv { font: 700 16px/1.1 var(--cond); font-variant-numeric: tabular-nums; color: var(--fg); }
  .tile.var .tl::after, .tile.bits16 .tl::after, .tile.act .tl::after { content: none; }
  .tile.sel { background: var(--acc); outline: none; }
  .tile.sel .tl, .tile.sel .tv { color: #1a1a1a; }
  .tile.on { background: #2f6a3f; border: 0; }
  .tile.act:active, .tile.flash { background: var(--ok); }
  .tile.act:active .tl, .tile.act:active .tv, .tile.flash .tl, .tile.flash .tv { color: #102010; }
  #popen { background: var(--acc); color: #1a1a1a; border: 0; border-radius: 6px; font: 700 15px var(--cond); }
  /* hover help, DSPECT tip style */
  #tip { background: #262b28; border: 1px solid var(--frame); color: var(--fg); font: 14px/1.35 system-ui, -apple-system, "Segoe UI", sans-serif; box-shadow: 0 4px 14px #0000008c; }
</style>
</head>
<body>
<button id="popen" data-help="Show the control panel.">☰ Controls</button>
<aside id="panel" aria-label="Control panel">
  <div class="phead"><b>Controls</b><span class="row" style="gap:6px"><button class="helpbtn" aria-pressed="false" data-help="Help mode: when on, hovering a control shows what it does and how to change it. Click again to turn it off.">ⓘ Help</button><button id="pside" data-help="Move this panel to the other side of the window (default right). Remembered across reloads.">⇆</button><button id="pclose" data-help="Hide this panel. Bring it back with the ☰ Controls button.">Hide</button></span></div>
  <div class="sbox">
    <div class="row" style="margin-bottom:6px"><span id="sname">Select a ⇄ or ⊞ tile to adjust</span><span id="sval" hidden></span>
      <input id="sedit" disabled spellcheck="false" aria-label="Exact value" data-help="Type an exact value for the selected tile and press Enter (Esc cancels). Numbers accept SI suffixes: 2.5k, 10M, 250m. Lists accept the option text or a number. Masks take hex."><span id="sunit" class="muted"></span></div>
    <div class="row" id="srow"><button id="sminus" aria-label="Decrease" data-help="One fine step down.">−</button><input type="range" id="slider" min="0" max="1000" value="0" disabled data-help="Adjusts the selected ⇄ tile. Frequency and pattern rate move on a log scale; lists step through their options. Arrow keys work when focused."><button id="splus" aria-label="Increase" data-help="One fine step up.">+</button></div>
    <div class="bits" id="bits" hidden data-help="Mask bits, DIO15 at top left to DIO0 at bottom right. Click a bit to flip it; lit = 1."></div>
  </div>
  <div class="tiles" id="tiles"></div>
</aside>

<header class="topbar">
  <b class="brand">AD2 <span>WebUSB</span> <span class="ver">k</span></b>
  <span class="leds"><span class="led g" id="l_link" title="link"></span><span class="led y" id="l_trig" title="trigger"></span><span class="led r" id="l_ovr" title="ADC clipped"></span></span>
  <button id="connect" class="primary" data-help="Connect to the Analog Discovery 2 over WebUSB. The first time, Chrome asks you to pick “Digilent USB Device”. Close WaveForms and any cap run first: only one program can hold the board.">Connect</button>
  <button id="disconnect" disabled data-help="Release the board so WaveForms or cap can use it. Outputs keep their last state.">Disconnect</button>
  <span id="state" class="muted">not connected</span>
  <span class="sep"></span>
  <span class="kv" data-help="FPGA IDCODE read over JTAG. 44002093 = XC6SLX16."><span class="k">ID</span><span id="idcode">–</span></span>
  <span class="kv" data-help="Bitstream running in the FPGA. “a5 build k” = our scope/AWG/LA design; anything else means program build k first."><span class="k">Design</span><span id="sig">–</span></span>
  <span class="kv" data-help="PLL lock and the 100 MHz sample clock. If they look wrong, press Init clocks + ADC."><span class="k">Clocks</span><span id="clk">–</span></span>
  <span class="kv" data-help="Calibration in use, read from the board’s EEPROM (IC37). This board keeps its own measured constants."><span class="k">Cal</span><span id="cal">–</span></span>
  <span class="sep"></span>
  <button id="progk" disabled data-help="Load our build k bitstream into the FPGA (about 0.4 s). Press Init clocks + ADC afterwards.">Program build k</button>
  <button id="init" disabled data-help="Start the PLL and sample clock and power-cycle the ADC. Needed once after programming, before the first capture.">Init clocks + ADC</button>
  <input type="file" id="file" accept=".bit" data-help="Choose your own .bit file for the XC6SLX16, then press Program file.">
  <button id="progf" disabled data-help="Load the chosen .bit file into the FPGA. Controls only work with designs that implement build k’s registers.">Program file</button>
  <progress id="prog" max="1" value="0" hidden></progress>
  <span style="flex:1"></span>
  <button class="helpbtn" aria-pressed="false" data-help="Help mode: when on, hovering a control shows what it does and how to change it. Click again to turn it off.">ⓘ Help</button>
</header>
<div id="tip" role="tooltip" hidden></div>

<main>
  <div class="card">
    <canvas id="cv"></canvas>
    <div class="chips">
      <div class="chip"><span class="sw" style="background:var(--c1)"></span><b>CH1</b><span id="s1" class="muted">–</span></div>
      <div class="chip"><span class="sw" style="background:var(--c2)"></span><b>CH2</b><span id="s2" class="muted">–</span></div>
      <div class="chip muted" id="sinfo"></div>
    </div>
  </div>
  <div class="card">
    <canvas id="lcv" style="height:420px"></canvas>
    <div class="chips"><div class="chip muted" id="linfo"></div></div>
  </div>
  <div class="card"><pre id="log"></pre></div>
</main>

<!-- settings store: the tiles read and write these; they are not shown -->
<div id="store" hidden>
  <select id="rate"><option value="100e6">100 MS/s</option><option value="50e6">50 MS/s</option><option value="10e6">10 MS/s</option>
    <option value="1e6" selected>1 MS/s</option><option value="100e3">100 kS/s</option><option value="10e3">10 kS/s</option></select>
  <select id="r1"><option value="1">±2.7 V</option><option value="0">±25 V</option></select>
  <select id="r2"><option value="1">±2.7 V</option><option value="0">±25 V</option></select>
  <select id="avgon"><option value="0">off</option><option value="1">on</option></select>
  <select id="avgN"><option>2</option><option>4</option><option>8</option><option selected>16</option><option>32</option>
    <option>64</option><option>128</option><option>256</option></select>
  <select id="vis1"><option value="1">shown</option><option value="0">hidden</option></select><select id="vis2"><option value="1">shown</option><option value="0">hidden</option></select>
  <select id="view"><option value="scope">Scope</option><option value="spec">Spectrum</option></select>
  <select id="swin"><option value="bh">Blackman-Harris</option><option value="hann">Hann</option><option value="flat">Flat-top</option><option value="rect">Rectangular</option></select>
  <select id="strace"><option value="live">live</option><option value="avg">average</option><option value="max">max hold</option></select>
  <select id="sN"><option>2</option><option>4</option><option selected>8</option><option>16</option><option>32</option><option>64</option><option>128</option></select>
  <input type="number" id="sref" value="10"><select id="sdiv"><option>1</option><option>2</option><option>5</option><option selected>10</option><option>20</option></select>
  <input type="number" id="fmax" value="50000000"><select id="flog"><option value="lin">linear</option><option value="log">log</option></select>
  <select id="smark"><option value="1">on</option><option value="0">off</option></select>
  <input type="number" id="vdiv1" value="0.5"><input type="number" id="vdiv2" value="0.5"><input type="number" id="off1" value="0"><input type="number" id="off2" value="0">
  <select id="tsrc"><option value="off">off</option><option value="0">CH1</option><option value="1">CH2</option></select>
  <select id="tedge"><option value="r">rising</option><option value="f">falling</option></select>
  <input type="number" id="tlev" value="0"><button id="single"></button><button id="run">Run</button>
  <select id="shape"><option>sine</option><option>square</option><option>triangle</option><option>saw</option><option value="sinc">sinc</option><option value="prbs">spread (PRBS)</option></select>
  <input type="number" id="slobes" value="8"><input type="number" id="sorder" value="7">
  <input type="number" id="freq" value="1000"><input type="number" id="a1" value="1"><input type="number" id="a2" value="1"><input type="number" id="ph" value="0">
  <button id="awgon"></button><button id="awgoff"></button><span id="awgst"></span>
  <input type="number" id="vp" value="1"><input type="number" id="vm" value="1"><input type="checkbox" id="vpon"><input type="checkbox" id="vmon">
  <button id="supply"></button><button id="suppoff"></button>
  <select id="pmode"><option value="usb">USB</option><option value="ext">external (AUX)</option></select>
  <button id="mon"></button><span id="supst">off</span><span id="musb">–</span><span id="maux">–</span><span id="mtmp">–</span>
  <select id="lrate"><option value="100e6">100 MS/s</option><option value="50e6">50 MS/s</option><option value="10e6" selected>10 MS/s</option>
    <option value="1e6">1 MS/s</option><option value="100e3">100 kS/s</option><option value="10e3">10 kS/s</option></select>
  <select id="lch"><option value="8">DIO 0–7</option><option value="16" selected>DIO 0–15</option></select>
  <select id="ltrig"><option value="off">off</option><option value="on">pattern / edge</option></select>

    this.adcW(0x08, 0x00); this.adcW(0xff, 0x01); await this.flush(); await sleep(500);
    this.adcW(0x14, 0x20); this.adcW(0x17, 0x81); this.adcW(0x0d, 0x00); this.adcW(0xff, 0x01); await this.flush(); await sleep(10);

  // ---------- calibration (IC37 via USER2 sig 69) ----------
  async loadCal() {

    for (let a = 0; a < 67; a++) {

// ---- page ----
const $ = id => document.getElementById(id);
const log = s => {
  const l = $('log'); l.textContent += s + '\n'; l.scrollTop = l.scrollHeight;
  if (/^(localhost|127\.0\.0\.1)$/.test(location.hostname))       // only to serve.py on this machine, never to a web host
    fetch('log', { method: 'POST', body: s }).catch(() => {});   // serve.py appends it to page.log (best effort)
};
const hex = (v, n) => (v >>> 0).toString(16).padStart(n, '0');
// every outside call into the driver is queued: a tile change during Run waits for the current capture instead of
// interleaving USB traffic. Calls the driver makes on itself use the real object, so they are not queued again.
let devChain = Promise.resolve();
function serialised(obj) {
  return new Proxy(obj, { get(t, k) {
    const v = t[k];
    if (typeof v !== 'function' || v.constructor.name !== 'AsyncFunction') return v;
    return (...a) => { const p = devChain.then(() => v.apply(t, a)); devChain = p.catch(() => {}); return p; };
  } });
}
let ad = null, running = false, busyNow = false, last = null, laRunning = false, lalast = null;

function setBusy(on) {
  busyNow = on;
  for (const id of ['disconnect', 'progk', 'progf', 'init', 'single', 'awgon', 'awgoff', 'supply', 'suppoff', 'pmode', 'mon', 'lsingle', 'pgon', 'pgoff', 'dset', 'dread', 'latest']) $(id).disabled = on || !ad;
  $('lrun').disabled = !ad || (on && !laRunning);
  $('run').disabled = !ad || (on && !running);
  $('connect').disabled = on || !!ad;
}
async function guard(fn) {
  setBusy(true);
  try { await fn(); } catch (e) { log('error: ' + e.message); $('state').innerHTML = `<span class="bad">${e.message}</span>`; running = false; $('run').textContent = 'Run'; }
  setBusy(false);
}
async function refresh() {
  const id = await ad.idcode(), s = await ad.status(), sig = Number(s >> 48n);
  $('idcode').innerHTML = `${hex(id, 8)} ` + ((id & 0x0fffffff) === 0x4002093 ? '<span class="ok">XC6SLX16</span>' : '<span class="bad">unexpected</span>');
  $('sig').innerHTML = sig === 0xa5 ? 'a5 <span class="ok">build k</span>' : `<span class="bad">${hex(sig, 2)} — not build k</span>`;
  $('clk').textContent = sig === 0xa5 ? `PLL lock ${Number(s >> 41n & 1n)}, sample clock ${(Number(s & 0x1ffffn) / 1000).toFixed(3)} MHz` : '–';
  log(`IDCODE ${hex(id, 8)}, signature ${hex(sig, 2)}`);
  return sig === 0xa5;
}
async function afterDesign() {
  await ad.syncBackground();
  try { const c = await ad.loadCal(); $('cal').textContent = c.source; log('calibration: ' + c.source); }
  catch (e) { $('cal').textContent = 'defaults (' + e.message + ')'; log('calibration: ' + e.message); }
  await monitors();
}
// ---------- start-up: Connect brings the board to a ready state on its own ----------
// blank FPGA -> load build k; clocks not running -> Init; then calibration, monitors and one warm-up capture (the
// first FIFO session after Init times out). Another design already loaded is left alone (not ready for these tools).
let boardReady = false;
const stage = (txt, ok = false) => { $('state').innerHTML = ok ? `<span class="ok">${txt}</span>` : txt; log('start-up: ' + txt); };
const needReady = what => { if (!boardReady) throw new Error(`board not ready for ${what}: press Connect (it loads and initialises build k)`); };
async function clocksRunning() { const s = await ad.status(); return !!(s >> 41n & 1n) && Math.abs(Number(s & 0x1ffffn) / 1000 - 100) < 0.5; }
async function initBoard() {
  stage('initialising clocks + ADC');
  const r = await ad.init(); ad.lastHg = null;
  log(`init: signature ${hex(r.sig, 2)}, PLL lock ${r.pllLock}, ${r.mhz.toFixed(3)} MHz, DCM ${r.dcm}`);
  if (!r.pllLock || Math.abs(r.mhz - 100) > 0.5) throw new Error(`Init did not lock the clocks (PLL ${r.pllLock}, ${r.mhz.toFixed(3)} MHz)`);
}
async function finishStartup() {
  await refresh(); stage('loading calibration'); await afterDesign();
  stage('warm-up capture');
  try { await ad.acquire({ rate: 1e6 }); } catch { try { await ad.acquire({ rate: 1e6 }); } catch (e) { throw new Error('warm-up capture failed: ' + e.message); } }
  boardReady = true; stage('ready', true); renderTiles();
}
async function startup() {
  boardReady = false;
  stage('checking the FPGA');
  let sig = await ad.signature();
  if (sig === 0x00 || sig === 0xff) {               // power-up state: nothing loaded
    stage('FPGA blank: loading build k');
    await prog(await kTopBit(), 'build k', false);
    sig = await ad.signature();
  }
  if (sig === 0xa5 && !(await ad.current())) {      // an earlier build k (6-bit FIFO) is still loaded
    stage('older build k loaded: reloading');
    await prog(await kTopBit(), 'build k', false);
    sig = await ad.signature();
  }
  if (sig !== 0xa5) { await refresh(); stage(`another design is loaded (signature ${hex(sig, 2)}): use Program build k to use these tools`); return; }

$('connect').onclick = () => guard(async () => {
  if (!navigator.usb) throw new Error('WebUSB not available in this browser');
  const known = (await navigator.usb.getDevices()).find(x => x.vendorId === 0x0403 && x.productId === 0x6014);
  const d = known || await navigator.usb.requestDevice({ filters: [{ vendorId: 0x0403, productId: 0x6014 }] });
  ad = serialised(new AD2(d, log)); await ad.open();
  log('connected');
  await startup();
});
$('disconnect').onclick = () => guard(async () => {
  running = false; laRunning = false; boardReady = false;
  try { await ad.close(); } finally { ad = null; }
  $('state').textContent = 'not connected'; log('disconnected');
});
// load a bitstream; for build k (signature a5) continue straight into Init and the rest of the start-up
async function prog(buf, name, thenStart = true) {
  boardReady = false; running = false; laRunning = false; avgReset(); specReset();
  const pg = $('prog'); pg.hidden = false; pg.value = 0;
  log(`programming ${name}`);
  const c = await ad.program(buf, f => pg.value = f);
  log(`DONE (IR capture ${hex(c, 2)})`); ad.lastHg = null; $('awgst').textContent = '';
  pg.hidden = true;
  if (!thenStart) return;
  if (await ad.signature() === 0xa5) { await initBoard(); await finishStartup(); }
  else { await refresh(); stage(`${name} loaded (not build k): the scope, AWG and LA tiles need build k`); }
}
$('progk').onclick = () => guard(async () => prog(await kTopBit(), 'build k'));
$('progf').onclick = () => guard(async () => { const f = $('file').files[0]; if (!f) throw new Error('choose a .bit file'); await prog(await f.arrayBuffer(), f.name); });
$('init').onclick = () => guard(async () => {
  if (await ad.signature() !== 0xa5) throw new Error('Init needs build k: press Program build k');
  boardReady = false; await initBoard(); $('awgst').textContent = ''; await finishStartup();
});

// ---------- scope ----------
function opts() {
  const t = $('tsrc').value;
  return { rate: Number($('rate').value), hg: [$('r1').value === '1', $('r2').value === '1'],
           trig: t === 'off' ? null : { ch: Number(t), level: Number($('tlev').value), falling: $('tedge').value === 'f', autoMs: 200 } };
}
// ---------- triggered waveform averaging ----------
// The FPGA detects the trigger on every 100 MS/s sample but stores samples on a free-running decimation grid, so
// captures line up only to within one stored sample. Each triggered capture is therefore shifted so that the trigger
// channel's interpolated level crossing lands exactly on the trigger index, then folded into a running mean

if ($('avgN').selectedIndex < 0) $('avgN').value = '16';
syncRange(); sliderSetup(); renderTiles();
setBusy(false); draw(); ladraw();
// test hook (only with #debug in the URL): draw a synthetic capture without a board
if (location.hash === '#debug') window.ad2debug = {
  sineResidual,
  get ad() { return ad; },                          // the connected driver, for board tests
  async startupWith(fake) { ad = fake; await startup(); return { ready: boardReady, state: $('state').textContent }; },
  scope(ch1, ch2, dt = 1e-6) { specUpdate(ch1, ch2, dt); last = { ch1, ch2, dt, pre: 0, o: opts(), ms: 0, triggered: false }; draw(); return last.peaks; },
  feed(ch1, ch2, pre, triggered = true, dt = 1e-6) {  // one synthetic capture through the averaging path
    const o = opts(), r = { ch1, ch2, dt, pre, triggered }, d = accumulate(r, o);
    last = { ...r, ch1: d.ch1, ch2: d.ch2, avgInfo: d.avgInfo, o, ms: 0 }; draw(); renderTiles(); return { n: avg.n, info: d.avgInfo, ch1: d.ch1 };
  } };
</script>
